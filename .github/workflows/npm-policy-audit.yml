name: Security & Policy Audit

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  audit-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit Root .npmrc
              run: |
                echo "Checking root .npmrc for ACTIVE security policies..."
                ERRORS=()
      
                if [ ! -f ".npmrc" ]; then
                  echo "::error::Missing root .npmrc"
                  exit 1
                fi
      
                # ^        : Matches the start of the line
                # [[:space:]]* : Allows for leading whitespace
                # (no #)   : Implicitly ensures no # exists at the start
                
                grep -E "^[[:space:]]*min-package-age=7" .npmrc || ERRORS+=("min-package-age=7 is missing or commented out")
                grep -E "^[[:space:]]*package-lock-only=true" .npmrc || ERRORS+=("package-lock-only=true is missing or commented out")
                grep -E "^[[:space:]]*ignore-scripts=true" .npmrc || ERRORS+=("ignore-scripts=true is missing or commented out")
      
                if [ ${#ERRORS[@]} -ne 0 ]; then
                  for err in "${ERRORS[@]}"; do
                    echo "::error file=.npmrc::$err"
                  done
                  exit 1
                fi
                echo "✅ .npmrc policy is active and uncommented."

      - name: Audit for 'npm ci' Usage
        run: |
          echo "Scanning for 'npm install' usage in build/workflow files..."
          
          # We look for 'npm install' or 'npm i' in YAML (GitHub Actions) 
          # or shell scripts, excluding the word 'package.json' context.
          # We want to see 'npm ci' instead.
          
          # Search for prohibited install commands in sensitive files
          BAD_INSTALLS=$(grep -rEi "npm (install|i)($|[[:space:]])" .github/workflows/ *.sh scripts/ --exclude-dir=node_modules || true)

          if [ -n "$BAD_INSTALLS" ]; then
            echo "::error::Found 'npm install' usage. Please use 'npm ci' for deterministic and secure builds."
            echo "$BAD_INSTALLS"
            exit 1
          fi
          echo "✅ No unsafe npm install commands found in build scripts."

      - name: Verify Root Lockfile
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "::error::Workspaces require a root package-lock.json."
            exit 1
          fi
          echo "✅ Root lockfile present."
